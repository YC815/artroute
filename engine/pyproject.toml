[project]
name = "engine"
version = "0.1.0"
description = "artroute-engine：GPS art 路線吸附與搜尋引擎"
authors = [
    { name = "YC815", email = "yushun@chen.zone" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "osmium>=4.3.1",
    # 釘版：bike_patch 剝除哪些 tag 是對照 3.9.1 內嵌的 graph lua 決定的。升級前必須重跑
    # tests/test_bike_patch.py::test_other_bicycle_tags_cannot_reopen_expressway，並重新核對新版 lua 讀哪些自行車 tag
    "pyvalhalla==3.9.1",
    "scipy>=1.16",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["valhalla: 會實際建 Valhalla tiles（較慢）"]
